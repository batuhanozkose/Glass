name: Build Windows (.exe)

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: "Target architecture"
        required: true
        default: "x86_64"
        type: choice
        options:
          - x86_64
          - aarch64
      artifact_mode:
        description: "Artifact mode"
        required: true
        default: "full_with_cef"
        type: choice
        options:
          - full_with_cef
          - editor_only

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: "0"

jobs:
  build-windows:
    name: Build Windows (${{ github.event.inputs.architecture }})
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Enable long paths in Windows
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force

      - name: Enable long paths in Git
        shell: pwsh
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ github.event.inputs.architecture }}-pc-windows-msvc

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ github.event.inputs.architecture == 'aarch64' && 'amd64_arm64' || 'x64' }}

      - name: Pin FXC to stable Windows SDK (10.0.22621.0)
        shell: pwsh
        run: |
          $fxc = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\fxc.exe"
          if (-not (Test-Path $fxc)) {
            Write-Host "10.0.22621.0 not found, falling back to latest..."
            $fxc = (Get-Command fxc.exe -ErrorAction SilentlyContinue).Source
            if (-not $fxc) {
              $sdkBin = "C:\Program Files (x86)\Windows Kits\10\bin"
              $latest = Get-ChildItem $sdkBin -Directory | Where-Object { $_.Name -match '^10\.' } | Sort-Object Name -Descending | Select-Object -First 1
              if ($latest) { $fxc = Join-Path $latest.FullName "x64\fxc.exe" }
            }
          }
          if (-not $fxc -or -not (Test-Path $fxc)) {
            Write-Error "fxc.exe not found"; exit 1
          }
          Write-Host "Using fxc.exe: $fxc"
          echo "GPUI_FXC_PATH=$fxc" >> $env:GITHUB_ENV

      - name: Validate FXC /I flag (fast-fail test)
        shell: pwsh
        run: |
          $fxc = $env:GPUI_FXC_PATH
          if (-not $fxc -or -not (Test-Path $fxc)) {
            Write-Error "GPUI_FXC_PATH not set or invalid"; exit 1
          }

          # Quick smoke test: verify fxc.exe runs
          & $fxc /? 2>&1 | Select-Object -First 5 | ForEach-Object { Write-Host $_ }
          Write-Host "fxc.exe smoke test passed"

          # Test /I flag with a dummy shader (avoid heredoc to keep YAML valid)
          'float4 main() : SV_Target { return float4(1,0,0,1); }' | Out-File -FilePath "$env:TEMP\dummy.hlsl" -Encoding ascii

          & $fxc /T ps_4_1 /E main /Fo "$env:TEMP\dummy.cso" /I $env:TEMP "$env:TEMP\dummy.hlsl" 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Error "fxc failed even with /I on dummy shader"; exit 1
          }
          Write-Host "OK: fxc /I flag works"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-${{ github.event.inputs.architecture }}
          cache-targets: true
          cache-all-crates: true

      - name: Install CMake and Ninja
        run: |
          choco install cmake ninja --installargs 'ADD_CMAKE_TO_PATH=System' -y
        shell: pwsh

      - name: Install cargo-about
        run: cargo install "cargo-about@0.8.2" --locked
        shell: pwsh

      - name: Generate licenses
        run: |
          if (Test-Path "script/generate-licenses.ps1") {
            pwsh -ExecutionPolicy Bypass -File script/generate-licenses.ps1
          } else {
            Write-Host "No generate-licenses script found, creating placeholder"
            New-Item -ItemType Directory -Force -Path assets | Out-Null
            "# Licenses`n(generated during build)" | Out-File -FilePath assets/licenses.md -Encoding utf8
          }
        shell: pwsh

      - name: Download AMD GPU Services SDK
        if: github.event.inputs.architecture == 'x86_64'
        run: |
          $url = "https://codeload.github.com/GPUOpen-LibrariesAndSDKs/AGS_SDK/zip/refs/tags/v6.3.0"
          $zipPath = ".\AGS_SDK_v6.3.0.zip"
          Invoke-WebRequest -Uri $url -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath "." -Force
        shell: pwsh

      - name: Download ConPTY
        run: |
          $url = "https://github.com/microsoft/terminal/releases/download/v1.23.13503.0/Microsoft.Windows.Console.ConPTY.1.23.251216003.nupkg"
          $zipPath = ".\Microsoft.Windows.Console.ConPTY.nupkg"
          Invoke-WebRequest -Uri $url -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath ".\conpty" -Force
        shell: pwsh

      - name: Set release channel
        run: |
          $channel = Get-Content "crates/zed/RELEASE_CHANNEL" -ErrorAction SilentlyContinue
          if (-not $channel) { $channel = "dev" }
          $channel = $channel.Trim()
          echo "ZED_RELEASE_CHANNEL=$channel" >> $env:GITHUB_ENV
          echo "RELEASE_CHANNEL=$channel" >> $env:GITHUB_ENV
          echo "Release channel: $channel"
        shell: pwsh

      - name: Build Glass (zed.exe, cli.exe, auto_update_helper.exe)
        run: |
          $target = "${{ github.event.inputs.architecture }}-pc-windows-msvc"
          cargo build --release --package zed --package cli --package auto_update_helper --target $target
        shell: pwsh

      - name: Build explorer_command_injector.dll
        run: |
          $target = "${{ github.event.inputs.architecture }}-pc-windows-msvc"
          cargo build --release --package explorer_command_injector --target $target
        shell: pwsh

      - name: Build remote_server.exe
        run: |
          $target = "${{ github.event.inputs.architecture }}-pc-windows-msvc"
          cargo build --release --package remote_server --target $target
        shell: pwsh

      - name: Stage Windows CEF runtime
        run: |
          $target = "${{ github.event.inputs.architecture }}-pc-windows-msvc"
          $runtimeOutput = pwsh -ExecutionPolicy Bypass -File .\script\stage-windows-cef-runtime.ps1 -TargetDirectory ".\target\$target\release"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "CEF runtime staging script failed with exit code $LASTEXITCODE"
            exit 1
          }
          if (-not $runtimeOutput) {
            Write-Error "Failed to stage CEF runtime"
            exit 1
          }
          $runtimeLines = @($runtimeOutput | Where-Object { $_ -and $_.Trim() -ne "" })
          $runtimeDir = $runtimeLines[-1].Trim()
          if (-not (Test-Path $runtimeDir -PathType Container)) {
            Write-Error "Staged CEF runtime directory not found: $runtimeDir"
            exit 1
          }
          Write-Host "Staged CEF runtime: $runtimeDir"
          echo "STAGED_CEF_RUNTIME=$runtimeDir" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Collect build artifacts
        run: |
          $arch = "${{ github.event.inputs.architecture }}"
          $artifactMode = "${{ github.event.inputs.artifact_mode }}"
          $target = "$arch-pc-windows-msvc"
          $outDir = ".\target\$target\release"
          $collectDir = ".\target\glass-windows-$arch-$artifactMode"
          New-Item -ItemType Directory -Force -Path $collectDir | Out-Null

          Copy-Item "$outDir\zed.exe" "$collectDir\Glass.exe" -Force
          Copy-Item "$outDir\cli.exe" "$collectDir\cli.exe" -Force
          Copy-Item "$outDir\auto_update_helper.exe" "$collectDir\auto_update_helper.exe" -Force
          Copy-Item "$outDir\explorer_command_injector.dll" "$collectDir\explorer_command_injector.dll" -Force
          Copy-Item "$outDir\remote_server.exe" "$collectDir\remote_server.exe" -Force

          if (-not $env:STAGED_CEF_RUNTIME -or -not (Test-Path $env:STAGED_CEF_RUNTIME -PathType Container)) {
            Write-Error "STAGED_CEF_RUNTIME is not set or invalid"
            exit 1
          }
          Copy-Item -Path (Join-Path $env:STAGED_CEF_RUNTIME "*") -Destination $collectDir -Recurse -Force

          if ($arch -eq "x86_64") {
            New-Item -ItemType Directory -Force -Path "$collectDir\x64" | Out-Null
            New-Item -ItemType Directory -Force -Path "$collectDir\arm64" | Out-Null
            Copy-Item ".\conpty\build\native\runtimes\x64\OpenConsole.exe" "$collectDir\x64\OpenConsole.exe" -Force
            Copy-Item ".\conpty\build\native\runtimes\arm64\OpenConsole.exe" "$collectDir\arm64\OpenConsole.exe" -Force
            Copy-Item ".\conpty\runtimes\win-x64\native\conpty.dll" "$collectDir\conpty.dll" -Force
            if (Test-Path ".\AGS_SDK-6.3.0\ags_lib\lib\amd_ags_x64.dll") {
              Copy-Item ".\AGS_SDK-6.3.0\ags_lib\lib\amd_ags_x64.dll" "$collectDir\amd_ags_x64.dll" -Force
            }
          } else {
            New-Item -ItemType Directory -Force -Path "$collectDir\arm64" | Out-Null
            Copy-Item ".\conpty\build\native\runtimes\arm64\OpenConsole.exe" "$collectDir\arm64\OpenConsole.exe" -Force
            Copy-Item ".\conpty\runtimes\win-arm64\native\conpty.dll" "$collectDir\conpty.dll" -Force
          }

          Write-Host "Collected files:"
          Get-ChildItem $collectDir -Recurse | Select-Object FullName
        shell: pwsh

      - name: Bundle MSVC runtime DLLs
        shell: pwsh
        run: |
          $arch = "${{ github.event.inputs.architecture }}"
          $artifactMode = "${{ github.event.inputs.artifact_mode }}"
          $collectDir = ".\target\glass-windows-$arch-$artifactMode"

          # Find MSVC runtime DLLs from the CI runner's VS installation
          $vcRedistDir = $env:VCToolsRedistDir
          if (-not $vcRedistDir) {
            Write-Error "VCToolsRedistDir not set — MSVC dev environment not configured"
            exit 1
          }

          # Resolve architecture-specific CRT directory
          $crtArch = if ($arch -eq "aarch64") { "arm64" } else { "x64" }
          $crtDir = Join-Path $vcRedistDir $crtArch
          if (-not (Test-Path $crtDir)) {
            # Fallback: search for Microsoft.VC143.CRT directory
            $crtDir = Get-ChildItem -Path $vcRedistDir -Directory -Filter "Microsoft.VC*.CRT" -ErrorAction SilentlyContinue |
              ForEach-Object { Join-Path $_.FullName $crtArch } |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1
          }

          if (-not $crtDir -or -not (Test-Path $crtDir)) {
            Write-Error "Cannot find MSVC CRT directory for $crtArch under $vcRedistDir"
            exit 1
          }

          Write-Host "MSVC CRT directory: $crtDir"

          # Copy required MSVC runtime DLLs
          $msvcDlls = @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll")
          foreach ($dll in $msvcDlls) {
            $source = Join-Path $crtDir $dll
            if (Test-Path $source) {
              Copy-Item $source -Destination $collectDir -Force
              Write-Host "OK: bundled $dll"
            } else {
              Write-Warning "MSVC runtime DLL not found: $source"
            }
          }

          # Also copy ucrtbase DLLs if available (needed on older Windows)
          $ucrtDir = "C:\Program Files (x86)\Windows Kits\10\Redist\ucrt\dlls\$crtArch"
          if (Test-Path $ucrtDir) {
            $ucrtDlls = @("ucrtbase.dll")
            foreach ($dll in $ucrtDlls) {
              $source = Join-Path $ucrtDir $dll
              if (Test-Path $source) {
                Copy-Item $source -Destination $collectDir -Force
                Write-Host "OK: bundled $dll"
              }
            }
          }

          Write-Host "MSVC runtime bundling complete"

      - name: Validate DLL dependencies
        shell: pwsh
        run: |
          $arch = "${{ github.event.inputs.architecture }}"
          $artifactMode = "${{ github.event.inputs.artifact_mode }}"
          $collectDir = ".\target\glass-windows-$arch-$artifactMode"
          $glassExe = Join-Path $collectDir "Glass.exe"

          if (-not (Test-Path $glassExe)) {
            Write-Error "Glass.exe not found in artifact directory"
            exit 1
          }

          # Use dumpbin to list DLL dependencies
          $dumpbinOutput = & dumpbin /dependents $glassExe 2>&1
          Write-Host "=== Glass.exe DLL Dependencies ==="
          $dumpbinOutput | ForEach-Object { Write-Host $_ }

          # Extract DLL names from dumpbin output
          $dependencies = $dumpbinOutput | Where-Object { $_ -match '^\s+\S+\.dll\s*$' } | ForEach-Object { $_.Trim() }

          # Check that bundled DLLs are present
          $bundledDlls = Get-ChildItem -Path $collectDir -Filter "*.dll" -Recurse | Select-Object -ExpandProperty Name
          Write-Host "`n=== Bundled DLLs ==="
          $bundledDlls | ForEach-Object { Write-Host "  $_" }

          # Known system DLLs that don't need bundling (provided by Windows 10+)
          $systemDlls = @(
            "KERNEL32.dll", "USER32.dll", "GDI32.dll", "ADVAPI32.dll",
            "ole32.dll", "OLEAUT32.dll", "SHELL32.dll", "SHLWAPI.dll",
            "ntdll.dll", "WS2_32.dll", "WINMM.dll", "IMM32.dll",
            "dbghelp.dll", "VERSION.dll", "CRYPT32.dll", "bcrypt.dll",
            "dwmapi.dll", "uxtheme.dll", "d3d11.dll", "dxgi.dll",
            "d3dcompiler_47.dll", "SETUPAPI.dll", "cfgmgr32.dll",
            "PROPSYS.dll", "WTSAPI32.dll", "NETAPI32.dll", "Secur32.dll",
            "RPCRT4.dll", "NSI.dll", "MSASN1.dll", "ncrypt.dll",
            "DPAPI.dll", "WINTRUST.dll", "MSCTF.dll", "COMCTL32.dll",
            "CRYPTBASE.dll", "bcryptPrimitives.dll", "gdi32full.dll",
            "msvcp_win.dll", "win32u.dll", "ucrtbase.dll", "USERENV.dll",
            "profapi.dll", "POWRPROF.dll", "kernel.appcore.dll",
            "CRYPTSP.dll", "rsaenh.dll", "DEVOBJ.dll", "UMPDC.dll",
            "windows.storage.dll", "wintypes.dll", "CoreMessaging.dll",
            "CoreUIComponents.dll", "TextInputFramework.dll",
            "dcomp.dll", "twinapi.appcore.dll", "dxcore.dll",
            "directxdatabasehelper.dll", "d3d12.dll", "D3D12Core.dll",
            "D3D12SDKLayers.dll", "amd_ags_x64.dll", "conpty.dll",
            "OpenConsole.exe", "explorer_command_injector.dll"
          )

          # Check for potentially missing non-system DLLs
          $missing = @()
          foreach ($dep in $dependencies) {
            $isSystem = $systemDlls -contains $dep
            $isBundled = $bundledDlls -contains $dep
            if (-not $isSystem -and -not $isBundled) {
              $missing += $dep
            }
          }

          if ($missing.Count -gt 0) {
            Write-Warning "Potentially missing DLLs (not bundled, not known system DLLs):"
            $missing | ForEach-Object { Write-Warning "  - $_" }
          } else {
            Write-Host "`nOK: All non-system DLL dependencies are either bundled or are known system DLLs"
          }

          # Verify critical bundled DLLs exist
          $criticalDlls = @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll")
          foreach ($dll in $criticalDlls) {
            $path = Join-Path $collectDir $dll
            if (Test-Path $path) {
              $size = (Get-Item $path).Length / 1KB
              Write-Host "OK: $dll ($([math]::Round($size, 1)) KB)"
            } else {
              Write-Error "CRITICAL: $dll is missing from artifact"
              exit 1
            }
          }

          Write-Host "`nDLL dependency validation passed"

      - name: Validate packaged runtime contents
        run: |
          $arch = "${{ github.event.inputs.architecture }}"
          $artifactMode = "${{ github.event.inputs.artifact_mode }}"
          $collectDir = ".\target\glass-windows-$arch-$artifactMode"

          $requiredFiles = @(
            "Glass.exe",
            "libcef.dll",
            "chrome_elf.dll",
            "icudtl.dat"
          )
          foreach ($fileName in $requiredFiles) {
            $path = Join-Path $collectDir $fileName
            if (-not (Test-Path $path)) {
              Write-Error "Missing required file in artifact: $fileName"
              exit 1
            }
          }

          $requiredDirs = @("locales", "swiftshader")
          foreach ($dirName in $requiredDirs) {
            $path = Join-Path $collectDir $dirName
            if (-not (Test-Path $path -PathType Container)) {
              Write-Error "Missing required directory in artifact: $dirName"
              exit 1
            }
          }

          Write-Host "Artifact runtime validation passed"
        shell: pwsh

      - name: Upload Glass.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: Glass-windows-${{ github.event.inputs.architecture }}-${{ github.event.inputs.artifact_mode }}
          path: target/glass-windows-${{ github.event.inputs.architecture }}-${{ github.event.inputs.artifact_mode }}/
          if-no-files-found: error

      - name: Upload remote_server artifact
        uses: actions/upload-artifact@v4
        with:
          name: glass-remote-server-windows-${{ github.event.inputs.architecture }}
          path: target/${{ github.event.inputs.architecture }}-pc-windows-msvc/release/remote_server.exe
          if-no-files-found: error
